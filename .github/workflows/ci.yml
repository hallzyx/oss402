name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter odyssey-auth build
      - run: pnpm --filter demo-kit build
      - run: pnpm --filter odyssey-auth-conformance build
      - run: pnpm --filter oss402-client build

      - run: pnpm test:valid
      - run: pnpm test:invalid
      - run: pnpm conformance:full:valid

      - name: demo-invalid fails the official suite with AUTH-017
        run: |
          set +e
          output=$(pnpm conformance:full:invalid 2>&1)
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            echo "demo-invalid passed the official suite; AUTH-017 was expected"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'AUTH-017'
